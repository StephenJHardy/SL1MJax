[project]
name = "sl1mjax"
version = "0.1.0"
description = "Differentiable radio-interferometric imaging in JAX"
readme = "README.md"
authors = [
    { name = "StephenJHardy", email = "sjh@pobox.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.1",
    "jax>=0.4",
    "numpy>=2.5.2",
    "optax>=0.2.8",
    "xarray>=2026.7.0",
    "zarr>=3.3.0",
]

[project.optional-dependencies]
ms = [
    "python-casacore>=3.8.1",
]

[project.scripts]
sl1mjax = "sl1mjax.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "E743"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["sl1mjax"]
disable_error_code = ["import-not-found", "import-untyped", "no-untyped-call"]
